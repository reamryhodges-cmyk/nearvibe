<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7657ff"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><title>NearVibe</title><style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;--bg:#0b0912;--card:#191624;--soft:#27213a;--muted:#aaa4b8;--purple:#7c5cff;--pink:#ff4d8d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#372060,transparent 45%),var(--bg);color:#fff}button,input,select{font:inherit}.hide{display:none!important}.shell{width:min(460px,100%);min-height:100vh;margin:auto;padding:28px 20px 50px}.brand{font-size:22px;font-weight:900}.brand b{color:#9b83ff}.hero{padding:45px 0 24px}.logo{width:66px;height:66px;display:grid;place-items:center;border-radius:22px;font-size:30px;font-weight:900;background:linear-gradient(135deg,var(--purple),var(--pink))}h1{font-size:42px;line-height:1.05;margin:15px 0 10px}p{color:var(--muted);line-height:1.5}.notice,.card{padding:18px;border:1px solid #ffffff14;border-radius:20px;background:var(--card)}.notice{margin:20px 0}.notice strong,.notice span{display:block}.notice span{margin-top:5px;color:var(--muted);font-size:13px}.primary,.tab{border:0;border-radius:14px;padding:14px;color:#fff;font-weight:900}.primary{width:100%;background:linear-gradient(135deg,var(--purple),var(--pink))}.tabs{display:flex;gap:5px;padding:4px;border-radius:13px;background:#0d0b13}.tab{flex:1;background:transparent;color:var(--muted)}.tab.on{background:var(--soft);color:#fff}.form{display:grid;gap:13px;margin-top:18px}label{display:grid;gap:6px;color:#d7d0df;font-size:12px;font-weight:800}input,select{width:100%;padding:13px;border:1px solid #ffffff18;border-radius:12px;background:#0d0b13;color:#fff}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.check{grid-template-columns:20px 1fr;font-weight:500}.check input{width:auto}.message{min-height:24px;color:#ffb4c9;font-size:13px;font-weight:800}.safe{text-align:center;font-size:12px}</style></head><body><main class="shell"><div class="brand"><b>●</b> NearVibe</div><section class="hero"><div class="logo">N</div><h1>Meet nearby.<br>Feel the vibe.</h1><p>Safer local social discovery for adults, with approximate locations and clear safety controls.</p><div class="notice"><strong>Adults only — 18+</strong><span>By continuing, you confirm you are at least 18 years old.</span></div></section><section class="card"><div class="tabs"><button class="tab on" data-form="signup">Create account</button><button class="tab" data-form="login">Log in</button></div><form id="signup" class="form"><label>First name<input name="name" maxlength="30" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="10" autocomplete="new-password" placeholder="At least 10 characters" required></label><label>Date of birth<input name="dob" type="date" required></label><div class="two"><label>Gender<select name="gender" required><option value="">Select</option><option>Woman</option><option>Man</option><option>Non-binary</option><option>Self-describe</option></select></label><label>Meet<select name="lookingFor" required><option value="">Select</option><option>Women</option><option>Men</option><option>Everyone</option></select></label></div><label class="check"><input type="checkbox" required><span>I accept the Community Rules and confirm I am 18+.</span></label><button class="primary">Create my profile</button></form><form id="login" class="form hide"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Log in securely</button></form><div id="message" class="message" role="alert"></div></section><p class="safe">Your exact location is never displayed.</p></main><script>const q=s=>document.querySelector(s),tabs=document.querySelectorAll('.tab');tabs.forEach(b=>b.onclick=()=>{tabs.forEach(x=>x.classList.remove('on'));b.classList.add('on');q('#signup').classList.toggle('hide',b.dataset.form!=='signup');q('#login').classList.toggle('hide',b.dataset.form!=='login');q('#message').textContent=''});async function submit(path,data,button){button.disabled=true;const old=button.textContent;button.textContent='Connecting…';q('#message').textContent='';try{const c=new AbortController(),timer=setTimeout(()=>c.abort(),25000),r=await fetch('/api'+path,{method:'POST',credentials:'same-origin',signal:c.signal,headers:{'content-type':'application/json'},body:JSON.stringify(data)});clearTimeout(timer);const result=await r.json().catch(()=>({error:'Unexpected server response.'}));if(!r.ok)throw new Error(result.error||'Request failed.');location.replace('/app')}catch(e){q('#message').textContent=e.name==='AbortError'?'Cloudflare took too long. Please try again.':e.message;button.disabled=false;button.textContent=old}}q('#login').onsubmit=e=>{e.preventDefault();const f=e.currentTarget;submit('/auth/login',{email:f.email.value.trim(),password:f.password.value},f.querySelector('button'))};q('#signup').onsubmit=e=>{e.preventDefault();const f=e.currentTarget;submit('/auth/signup',{name:f.name.value.trim(),email:f.email.value.trim(),password:f.password.value,dob:f.dob.value,gender:f.gender.value,lookingFor:f.lookingFor.value},f.querySelector('button'))};fetch('/api/me',{credentials:'same-origin'}).then(r=>{if(r.ok)location.replace('/app')}).catch(()=>{});</script></body></html>
