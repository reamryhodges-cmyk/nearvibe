<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7657ff">
  <title>Log in · NearVibe</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top,#372060,transparent 45%),#0b0912;color:#faf8ff;font-family:Inter,system-ui,sans-serif}.card{width:min(430px,100%);padding:25px;border:1px solid #ffffff18;border-radius:24px;background:#191624}.brand{font-size:25px;font-weight:900;margin-bottom:24px}.brand b{color:#9b83ff}h1{margin:0 0 8px;font-size:34px}p{color:#aaa4b8;line-height:1.5}label{display:grid;gap:7px;margin:16px 0;color:#d1ccdb;font-size:13px;font-weight:800}input{width:100%;padding:15px;border:1px solid #ffffff18;border-radius:13px;background:#0d0b13;color:white;font:inherit}button{width:100%;padding:15px;border:0;border-radius:14px;color:white;background:linear-gradient(135deg,#7c5cff,#ff4d8d);font:inherit;font-weight:900}button:disabled{opacity:.65}.message{min-height:24px;margin-top:15px;color:#ffb4c9;font-weight:700}.safe{text-align:center;font-size:12px}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><b>●</b> NearVibe</div>
    <h1>Log in</h1>
    <p>Secure access to your NearVibe account.</p>
    <form id="loginForm">
      <label>Email<input id="email" type="email" autocomplete="email" required></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
      <button id="submit" type="submit">Log in securely</button>
    </form>
    <div id="message" class="message" role="alert"></div>
    <p class="safe">🔒 Your password is sent only to NearVibe over HTTPS.</p>
  </main>
  <script>
    document.querySelector('#loginForm').addEventListener('submit',async event=>{
      event.preventDefault();
      const button=document.querySelector('#submit'),message=document.querySelector('#message');
      button.disabled=true;button.textContent='Logging in…';message.textContent='Connecting securely…';
      const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),25000);
      try{
        const response=await fetch('/api/auth/login',{method:'POST',credentials:'same-origin',signal:controller.signal,headers:{'content-type':'application/json'},body:JSON.stringify({email:document.querySelector('#email').value.trim(),password:document.querySelector('#password').value})});
        const data=await response.json().catch(()=>({error:'Unexpected server response.'}));
        if(!response.ok)throw new Error(data.error||'Login failed.');
        localStorage.setItem('nv_user',JSON.stringify({...data.user,server:true}));
        message.style.color='#9fffc0';message.textContent='Login successful. Opening NearVibe…';
        location.replace('/?build=17');
      }catch(error){message.textContent=error.name==='AbortError'?'Cloudflare took too long. Tap Log in to try again.':error.message;button.disabled=false;button.textContent='Log in securely'}finally{clearTimeout(timer)}
    });
  </script>
</body>
</html>
